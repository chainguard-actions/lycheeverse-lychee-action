name: Test custom lychee version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file with a valid link
        run: |
          mkdir -p tests/tmp
          cat > tests/tmp/test-version.md << 'EOF'
          # Test Document
          [Example](https://example.com)
          EOF

      - id: action
        uses: .
        with:
          args: "--verbose --no-progress 'tests/tmp/test-version.md'"
          lycheeVersion: "v0.18.1"
          fail: "false"
          failIfEmpty: "false"
          output: "lychee/out-version.md"

      - name: Assert exit_code output is set
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "exit_code: $EXIT_CODE"
          if [ -z "$EXIT_CODE" ]; then
            echo "FAIL: exit_code output was not set"
            exit 1
          fi
          echo "PASS: exit_code is '$EXIT_CODE'"

      - name: Assert output file was created
        run: |
          if [ ! -f "lychee/out-version.md" ]; then
            echo "FAIL: output file lychee/out-version.md was not created"
            exit 1
          fi
          echo "PASS: output file exists"
          cat lychee/out-version.md
