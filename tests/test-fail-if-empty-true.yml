name: Test failIfEmpty true - fails when no links found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file with no links
        run: |
          mkdir -p tests/tmp
          cat > tests/tmp/no-links-fail.md << 'EOF'
          # Test Document
          This document has no links at all.
          Just plain text content here.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          args: "--verbose --no-progress 'tests/tmp/no-links-fail.md'"
          fail: "true"
          failIfEmpty: "true"
          output: "lychee/out-empty-fail.md"

      - name: Assert action failed because no links were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when failIfEmpty=true and no links found, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no links were found"
